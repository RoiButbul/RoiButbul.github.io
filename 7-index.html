<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>FORGE</title>
<style>
:root{
  --bg:#0a0a0c; --card:#141417; --card2:#1c1c21; --line:#26262c;
  --tx:#f4f4f1; --dim:#8f8f98; --acc:#d8ff4a; --acc-soft:rgba(216,255,74,.12);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;background:var(--bg);color:var(--tx);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
body.workout #app{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
body.workout .tabbar{display:none}

header{padding:30px 6px 20px;display:flex;justify-content:space-between;align-items:baseline}
.brand{font-size:14px;font-weight:800;letter-spacing:.4em}
.brand i{font-style:normal;color:var(--acc)}
.date{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 6px 10px}

.exname{font-size:21px;font-weight:800;letter-spacing:-.01em}
.exsub{font-size:12.5px;color:var(--dim);margin-top:3px}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#0a0a0c;
  background:var(--acc);border-radius:99px;padding:3px 9px;margin-left:8px;vertical-align:2px}
.lastline{margin-top:12px;font-size:13px;color:var(--dim)}
.lastline b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}

.statrow{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:var(--card2);border-radius:14px;padding:12px 14px}
.stat .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}

.btn{width:100%;height:58px;border-radius:16px;font-size:17px;font-weight:800;letter-spacing:.01em}
.btn.acc{background:var(--acc);color:#0a0a0c}
.btn.acc:disabled{opacity:.3}
.btn.ghost{background:none;border:1.5px dashed var(--line);color:var(--dim);font-weight:600}
.btn.dark{background:#0a0a0c;color:var(--acc)}
.btn:active{transform:scale(.985)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.mini{padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);
  font-size:12px;font-weight:700;color:var(--tx);white-space:nowrap}
.mini:active{border-color:var(--acc)}

.hrow{display:flex;align-items:center;gap:12px;padding:15px 2px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:none}
.hrow .d{flex:none;width:92px;white-space:nowrap;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.hrow .s{flex:1;font-size:16.5px;font-weight:700;font-variant-numeric:tabular-nums}
.hrow .s small{font-weight:500;color:var(--dim);font-size:12.5px}
.hrow .del{color:var(--dim);font-size:16px;padding:6px}

.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px;border-top:1px solid var(--line)}
.field:first-child{border-top:none}
.field .fk{font-size:15px;font-weight:600}
.field .fs{font-size:12px;color:var(--dim);margin-top:2px}
.ministep{display:flex;align-items:center;gap:4px}
.ministep button{width:44px;height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px}
.ministep .v{min-width:58px;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

.notein{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;
  color:var(--tx);font:inherit;font-size:15px;padding:14px;margin:10px 0;outline:none}
.notein:focus{border-color:var(--acc)}

.lightchip{display:inline-block;background:var(--card2);border-radius:99px;padding:6px 13px;
  font-size:12.5px;color:var(--dim);margin:0 6px 6px 0;font-variant-numeric:tabular-nums}
.lightchip b{color:var(--acc);font-weight:700}

svg.chart{width:100%;height:auto;display:block;margin:6px 0 2px}
.chart-msg{color:var(--dim);font-size:13px;padding:18px 4px;text-align:center}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:rgba(10,10,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:480px;margin:0 auto;display:flex}
.tab{flex:1;padding:15px 0 17px;text-align:center;font-size:11px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.tab.on{color:var(--acc)}
.tab .dot{display:block;width:4px;height:4px;border-radius:50%;background:var(--acc);margin:5px auto 0;opacity:0}
.tab.on .dot{opacity:1}

.flash{position:fixed;inset:0;background:var(--acc);opacity:0;pointer-events:none;z-index:50;transition:opacity .15s}
.streakbar{display:flex;align-items:baseline;justify-content:space-between;padding:2px 6px 18px}
.streakmain{font-size:22px;font-weight:700}
.streakmain b{font-size:30px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;margin:0 2px}
.streakmain span{font-size:12px;color:var(--dim);font-weight:500;margin-left:4px}
.streaksub{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.celeb{position:fixed;inset:0;background:var(--acc);color:#0a0a0c;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;cursor:pointer}
.celeb .ct{font-size:13px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:rgba(10,10,12,.6)}
.celeb .cb{font-size:64px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:16px 0 10px}
.celeb .cs{font-size:17px;font-weight:600;color:rgba(10,10,12,.75)}
.celeb .ck{position:absolute;bottom:60px;font-size:11px;font-weight:800;letter-spacing:.24em;color:rgba(10,10,12,.5)}
.errbox{position:fixed;left:8px;right:8px;bottom:90px;background:#2a0d0d;color:#ff9d9d;
  font:11px/1.4 monospace;padding:10px;border-radius:8px;z-index:99;white-space:pre-wrap}

/* ---- v3: set-focused workout ---- */
.hero{padding:34px 4px 0;text-align:center}
.herolab{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.herolab b{color:var(--tx)}
.pdots{display:flex;gap:7px;justify-content:center;margin:16px 0 4px}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pdot.done{background:var(--acc)}
.pdot.cur{background:var(--tx)}
.wedit{display:flex;align-items:center;justify-content:center;gap:16px;margin:22px 0 4px}
.wedit button{flex:none;width:56px;height:56px;border-radius:16px;background:var(--card2);
  border:1px solid var(--line);font-size:26px;font-weight:600;display:grid;place-items:center}
.wedit button:active{background:var(--acc-soft)}
.bigw{font-size:82px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.bigw small{font-size:22px;font-weight:500;color:var(--dim);margin-left:6px}
.herolast{font-size:13px;color:var(--dim);margin:8px 0 26px;min-height:18px}
.herolast b{color:var(--tx)}
.replab{font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.repgrid{display:flex;gap:5px;margin-bottom:16px}
.repb{flex:1;height:58px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
  font-size:19px;font-weight:800;color:var(--tx);padding:0}
.repb:active{background:var(--acc-soft)}
.repb.on{background:var(--acc);color:#0a0a0c;border-color:var(--acc)}
.repb.side{flex:0 0 40px;color:var(--dim);font-size:22px;font-weight:500}
.linkrow{display:flex;justify-content:center;gap:26px;margin-top:20px}
.linkrow button{color:var(--dim);font-size:13px;font-weight:600;padding:8px 4px}
.linkrow button:active{color:var(--tx)}

.clock{font-size:96px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;margin:18px 0 4px}
.nextcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin:26px 0 18px;text-align:left}
.nextcard .nl{font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.nextcard .nn{font-size:20px;font-weight:800;margin-top:4px}
.nextcard .nw{font-size:14px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}

.overcard{background:var(--acc);color:#0a0a0c;border-radius:var(--r);padding:30px 22px;margin-top:60px;text-align:center}
.overcard .ot{font-size:30px;font-weight:800;letter-spacing:.02em}
.overcard .os{font-size:14px;margin:8px 0 20px;color:rgba(10,10,12,.7);font-weight:600}

.wrow{display:flex;align-items:center;gap:12px;padding:15px 2px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:none}
.wrow .wd{flex:none;width:44px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.wrow .wc{flex:1;font-size:15.5px;font-weight:700}
.wrow .wc small{color:var(--dim);font-weight:500}
.wrow .tag{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--acc)}
.wrow .tick{color:var(--acc);font-weight:800}
.wrow.future .wc{color:var(--dim)}
</style>
</head>
<body class="">
<div id="app"></div>
<nav class="tabbar"><div class="in" id="tabs"></div></nav>
<div class="flash" id="flash"></div>
<script>
'use strict';
window.addEventListener('error',function(e){
  var d=document.createElement('div');d.className='errbox';d.textContent=String(e.message||e.error);
  document.body.appendChild(d);
});

/* ---------------- config ---------------- */
var WORKER_URL='https://forge-push.roi-butbul22.workers.dev'; /* set at deploy */
var VAPID_PUBLIC='BFCyyYGhqex5y0MwhbJObDded2KpHlPcnIUu6DWtsAFg9C0Vz14EmThbJH9HOdpHL4s1SZU6G9cPmB_NXyoEMhA';

/* ---------------- state ---------------- */
var LS='forge.v1';
var EX={
  squat:   {name:'Squat',             kind:'bar', inc:2.5, seed:65, note:'RIR 1-2 per set'},
  pullup:  {name:'Weighted Pull-Up',  kind:'bw',  inc:2.5, add:10,  note:'to failure is fine'},
  deadlift:{name:'Deadlift',          kind:'bar', inc:2.5, seed:95, note:'RIR 1-2 per set'},
  press:   {name:'Standing DB Press', kind:'db',  inc:2,   seed:20, note:'weight per dumbbell'},
  dips:    {name:'Weighted Dips',     kind:'bw',  inc:2.5, add:10,  note:'to failure is fine'}
};
var ORDER=['squat','pullup','deadlift','press','dips'];
var REST_DEF={squat:180,pullup:180,deadlift:240,press:120,dips:180};
var DAYN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
var SCHED_DEF={
  0:{type:'lifts',ex:['squat','pullup']},
  1:{type:'lifts',ex:['deadlift','press']},
  2:{type:'lifts',ex:['dips','squat']},
  3:{type:'lifts',ex:['pullup','deadlift']},
  4:{type:'lifts',ex:['press','dips']},
  5:{type:'bag'},
  6:{type:'rest'}
};

function load(){ try{var s=JSON.parse(localStorage.getItem(LS)); if(s&&s.sessions)return s;}catch(e){} return null; }
var S=load()||{settings:{bw:75,rest:{}},schedule:null,sessions:[],draft:null,timer:null,view:'today'};
if(!S.settings)S.settings={bw:75,rest:{}};
if(!S.settings.rest)S.settings.rest={};
ORDER.forEach(function(id){if(typeof S.settings.rest[id]!=='number')S.settings.rest[id]=REST_DEF[id]});
if(!S.schedule)S.schedule=JSON.parse(JSON.stringify(SCHED_DEF));
for(var di=0;di<7;di++)if(!S.schedule[di])S.schedule[di]=JSON.parse(JSON.stringify(SCHED_DEF[di]));
if(typeof S.timer==='undefined')S.timer=null;
if(!S.overrides)S.overrides={};
if(!S.streak)S.streak={cur:0,best:0,freezes:0,lastEarned:0,lastCountedK:null,lastCountedTs:0,pwK:null};
if(!S.fulfilledDays)S.fulfilledDays={};
if(!S.celebQueue)S.celebQueue=[];
if(S.draft&&!S.draft.queue){S.draft=null;S.timer=null} /* v2 draft shape: discard */
function save(){ localStorage.setItem(LS,JSON.stringify(S)); }

var histEx='squat';
var lightRounds=5, lightMins=3, lightNote='';

/* ---------------- helpers ---------------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function fmtW(w){return (Math.round(w*10)/10).toString()}
function fmtT(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s}
function num(n){return n.toLocaleString('en-GB')}

function mainSessions(){return S.sessions.filter(function(s){return s.type==='main'})}
function lastEntry(exId){
  var ms=mainSessions();
  for(var i=ms.length-1;i>=0;i--){
    var en=ms[i].entries.find(function(e){return e.exId===exId});
    if(en&&en.sets.length)return {sets:en.sets,ts:ms[i].ts};
  }
  return null;
}
function seedW(exId){var e=EX[exId];return e.kind==='bw'?S.settings.bw+e.add:e.seed}
function target(exId){
  var last=lastEntry(exId);
  if(S.overrides&&typeof S.overrides[exId]==='number')return {w:S.overrides[exId],add:false,last:last};
  if(!last)return {w:seedW(exId),add:false,last:null};
  var all8=last.sets.every(function(s){return s.r>=8});
  return {w:all8?last.sets[0].w+EX[exId].inc:last.sets[0].w, add:all8, last:last};
}
function breakdown(exId,w){
  var e=EX[exId];
  if(e.kind!=='bw')return '';
  var extra=Math.round((w-S.settings.bw)*10)/10;
  return 'BW '+fmtW(S.settings.bw)+(extra>=0?' + ':' - ')+fmtW(Math.abs(extra));
}
function setsStr(sets){return fmtW(sets[0].w)+' x '+sets.map(function(s){return s.r}).join(', ')}
function e1rm(w,r){return w*(1+r/30)}
function tonnage(entries){var t=0;entries.forEach(function(e){e.sets.forEach(function(s){t+=s.w*s.r})});return Math.round(t)}
function schedText(d){
  var s=S.schedule[d];
  if(s.type==='bag')return 'Heavy bag';
  if(s.type==='rest')return 'Rest';
  return s.ex.map(function(id){return EX[id].name}).join(' + ');
}

/* ---------------- rest timer ---------------- */
function rem(){if(!S.timer)return 0;return Math.max(0,Math.ceil((S.timer.endsAt-Date.now())/1000))}
function startRest(ex){
  var d=S.settings.rest[ex]||180;
  S.timer={ex:ex,dur:d,endsAt:Date.now()+d*1000,fired:false,pid:null};
  save();grabWake();
  schedulePush(S.timer.endsAt);
}
function clearTimer(){
  cancelPush();
  S.timer=null;dropWake();save();
}

var wakeLock=null;
function grabWake(){try{if('wakeLock' in navigator){navigator.wakeLock.request('screen').then(function(l){wakeLock=l}).catch(function(){})}}catch(e){}}
function dropWake(){try{if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null}}catch(e){}}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&S.timer&&!S.timer.fired&&rem()>0)grabWake();
});

var AC=null;
function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){
  try{
    audio();if(!AC)return;
    var t0=AC.currentTime+0.03;
    for(var i=0;i<3;i++){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t0+i*0.3);
      g.gain.exponentialRampToValueAtTime(0.5,t0+i*0.3+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.3+0.2);
      o.connect(g);g.connect(AC.destination);
      o.start(t0+i*0.3);o.stop(t0+i*0.3+0.22);
    }
  }catch(e){}
}
function flash(){
  var f=document.getElementById('flash');if(!f)return;
  f.style.opacity='0.5';
  setTimeout(function(){f.style.opacity='0'},200);
  setTimeout(function(){f.style.opacity='0.35';setTimeout(function(){f.style.opacity='0'},200)},350);
}
setInterval(function(){
  if(!S.timer)return;
  var r=rem();
  var el=document.getElementById('ttime');
  if(el)el.textContent=fmtT(r);
  if(r<=0&&!S.timer.fired){
    S.timer.fired=true;
    var late=(Date.now()-S.timer.endsAt)>10000;
    dropWake();beep();
    try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}
    flash();
    S.timer=null;
    if(S.draft)S.draft.phase=late?'restover':'set';
    save();render();
  }
},500);

/* ---------------- web push (v4) ---------------- */
function pushOK(){
  return WORKER_URL.indexOf('YOUR-SUBDOMAIN')<0 &&
    'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function urlB64ToUint8Array(base64String){
  var padding='='.repeat((4-base64String.length%4)%4);
  var base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  var raw=atob(base64);var out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
function schedulePush(endsAt){
  if(!pushOK())return;
  (async function(){
    try{
      if(Notification.permission==='default'){
        var p=await Notification.requestPermission();
        if(p!=='granted')return;
      }
      if(Notification.permission!=='granted')return;
      var reg=await navigator.serviceWorker.ready;
      var sub=await reg.pushManager.getSubscription();
      if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC)});
      var id='t'+Date.now();
      if(S.timer)S.timer.pid=id;
      await fetch(WORKER_URL+'/schedule',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:id,fireAt:endsAt,subscription:sub.toJSON()})});
      save();
    }catch(e){}
  })();
}
function cancelPush(){
  try{
    if(S.timer&&S.timer.pid&&pushOK()){
      fetch(WORKER_URL+'/schedule?id='+encodeURIComponent(S.timer.pid),{method:'DELETE'}).catch(function(){});
    }
  }catch(e){}
}

/* ---------------- streak engine (v5) ---------------- */
function queueCeleb(c){S.celebQueue.push(c);if(S.celebQueue.length>5)S.celebQueue=S.celebQueue.slice(-5)}
function earnFreezes(st){
  while(st.cur>=st.lastEarned+14){
    if(st.freezes<2)st.freezes++;
    st.lastEarned+=14;
  }
}
function bumpStreak(st){
  st.cur++;
  if(st.cur>st.best)st.best=st.cur;
  earnFreezes(st);
  if([7,14,30,50,100].indexOf(st.cur)>=0)queueCeleb({type:'milestone',n:st.cur});
}
function evalStreak(){
  var st=S.streak;
  var todayK=dayKey(Date.now());
  var y=new Date();y.setDate(y.getDate()-1);
  var yK=dayKey(y.getTime());
  if(st.lastCountedK===yK||st.lastCountedK===todayK)return;
  if(!st.lastCountedK){st.lastCountedK=yK;st.lastCountedTs=y.getTime();save();return}
  var cursor=new Date(st.lastCountedTs);cursor.setDate(cursor.getDate()+1);
  var guard=0;
  while(dayKey(cursor.getTime())!==todayK&&guard++<400){
    var k=dayKey(cursor.getTime());
    var sched=S.schedule[cursor.getDay()];
    var ok=(sched.type==='rest')||!!S.fulfilledDays[k];
    if(ok){bumpStreak(st)}
    else if(st.freezes>0){st.freezes--;bumpStreak(st);queueCeleb({type:'freeze',cur:st.cur})}
    else{st.cur=0;st.lastEarned=0}
    cursor.setDate(cursor.getDate()+1);
  }
  st.lastCountedK=yK;st.lastCountedTs=y.getTime();
  save();
}
function fulfillToday(){
  evalStreak();
  var k=dayKey(Date.now());
  if(S.fulfilledDays[k])return false;
  S.fulfilledDays[k]=true;
  bumpStreak(S.streak);
  S.streak.lastCountedK=k;S.streak.lastCountedTs=Date.now();
  checkPerfectWeek();
  save();
  return true;
}
function checkPerfectWeek(){
  var now=new Date();
  if(now.getDay()!==6)return;
  var st=S.streak;
  var ws=new Date(now);ws.setDate(ws.getDate()-6);
  var wk=dayKey(ws.getTime());
  if(st.pwK===wk)return;
  for(var i=0;i<7;i++){
    var dt=new Date(ws);dt.setDate(ws.getDate()+i);
    var k=dayKey(dt.getTime());
    if(!(S.schedule[i].type==='rest'||S.fulfilledDays[k]))return;
  }
  st.pwK=wk;
  queueCeleb({type:'perfectweek'});
}
function weekStats(){
  var now=new Date();
  var ws=new Date(now);ws.setDate(ws.getDate()-ws.getDay());
  var done=0,total=0;
  for(var i=0;i<=now.getDay();i++){
    var dt=new Date(ws);dt.setDate(ws.getDate()+i);
    total++;
    var k=dayKey(dt.getTime());
    if(S.schedule[i].type==='rest'||S.fulfilledDays[k])done++;
  }
  return {done:done,total:total};
}

/* ---------------- workout (v3) ---------------- */
function startDraft(){
  var d=new Date().getDay();
  var sched=S.schedule[d];
  if(sched.type!=='lifts')return;
  var queue=[];
  sched.ex.forEach(function(id){
    var t=target(id);
    var reps=t.last?Math.min(t.last.sets[0].r,8):6;
    var nSets=t.last?t.last.sets.length:3;
    for(var i=0;i<nSets;i++)queue.push({ex:id,w:t.w,r:reps,done:false,entered:false});
  });
  S.draft={ts:Date.now(),day:d,queue:queue,phase:'set'};
  save();
}
function ptr(){
  if(!S.draft)return -1;
  for(var i=0;i<S.draft.queue.length;i++)if(!S.draft.queue[i].done)return i;
  return -1;
}
function setInfo(idx){
  var q=S.draft.queue,ex=q[idx].ex,k=0,n=0;
  for(var i=0;i<q.length;i++){if(q[i].ex===ex){n++;if(i<=idx)k++}}
  return {k:k,n:n};
}
function finishWorkout(){
  if(!S.draft)return;
  var planned=S.draft.queue.length;
  var doneN=S.draft.queue.filter(function(s){return s.done}).length;
  var entries=[];
  S.draft.queue.forEach(function(s){
    if(!s.done)return;
    var last=entries[entries.length-1];
    if(last&&last.exId===s.ex)last.sets.push({w:s.w,r:s.r});
    else entries.push({exId:s.ex,sets:[{w:s.w,r:s.r}]});
  });
  if(entries.length){
    /* celebrations computed against pre-session history */
    entries.forEach(function(e){
      var all8=e.sets.length>0&&e.sets.every(function(s){return s.r>=8});
      if(all8)queueCeleb({type:'weightup',ex:e.exId,from:e.sets[0].w,to:Math.round((e.sets[0].w+EX[e.exId].inc)*10)/10});
      e.sets.forEach(function(s){
        var best=0;
        mainSessions().forEach(function(ms){
          ms.entries.forEach(function(en){
            if(en.exId!==e.exId)return;
            en.sets.forEach(function(ps){if(ps.w===s.w&&ps.r>best)best=ps.r});
          });
        });
        if(best>0&&s.r>best)queueCeleb({type:'reppr',ex:e.exId,w:s.w,r:s.r});
      });
    });
    S.sessions.push({ts:Date.now(),type:'main',entries:entries});
  }
  entries.forEach(function(e){delete S.overrides[e.exId]});
  S.draft=null;clearTimer();
  if(doneN>0&&doneN*2>=planned)fulfillToday();
  S.view='today';save();render();
}

function rHistory(){
  var h='<header><div class="brand">F<i>O</i>RGE</div><div class="date">Progress</div></header>';

  ORDER.forEach(function(id){

  });

  if(!rows.length){
    h+='<div class="card"><div class="chart-msg">No sessions logged for '+esc(EX[histEx].name)+' yet.</div></div>';
  } else {
    var top=rows.map(function(r){var m=r.sets[0];r.sets.forEach(function(s){if(e1rm(s.w,s.r)>e1rm(m.w,m.r))m=s});return m});
    var pts=top.map(function(s){return e1rm(s.w,s.r)});
    var best=Math.max.apply(null,pts);
    var delta=pts.length>1?Math.round((pts[pts.length-1]-pts[0])*10)/10:0;

    h+='<div class="card"><div class="exname" style="font-size:17px">'+esc(EX[histEx].name)+'</div>';

    h+='<div class="stat"><div class="k">Trend</div><div class="v">'+(delta>=0?'+':'')+delta+'</div></div></div>';

    if(pts.length>1){
      var W=340,H=90,P=8;
      var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts);
      var rng=(mx-mn)||1;
      var step=(W-2*P)/(pts.length-1);
      var coords=pts.map(function(v,i){return [P+i*step, H-P-((v-mn)/rng)*(H-2*P)]});
      var line=coords.map(function(c){return c[0].toFixed(1)+','+c[1].toFixed(1)}).join(' ');
      h+='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
      h+='<polyline points="'+line+'" fill="none" stroke="#d8ff4a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      coords.forEach(function(c){h+='<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="2.6" fill="#d8ff4a"/>'});
      h+='</svg>';
    } else {
      h+='<div class="chart-msg">Log one more session to see the curve.</div>';
    }
    h+='</div>';

    h+='<div class="eyebrow">History</div><div class="card" style="padding-top:6px;padding-bottom:6px">';
    for(var i=rows.length-1;i>=0;i--){
      var r=rows[i];
      var si=-1;
      for(var j=S.sessions.length-1;j>=0;j--){if(S.sessions[j].ts===r.ts&&S.sessions[j].type==='main'){si=j;break}}

      h+='<button class="del" data-act="del" data-si="'+si+'">&#10005;</button></div>';
    }
    h+='</div>';
  }
  return h;
}

  else if(c.type==='milestone'){
    var subs={7:'One week of showing up.',14:'Two weeks straight.',30:'A full month.',50:'Fifty days. Serious.',100:'Triple digits. Rare air.'};
    t='Milestone';big=c.n+'-day streak';sub=subs[c.n]||'';
  }
  else if(c.type==='perfectweek'){t='Perfect week';big='7 / 7';sub='Every planned day, done.';}
  else if(c.type==='freeze'){t='Freeze used';big='\u2744';sub='A missed day, covered. Streak alive at '+c.cur+'.';}
  return '<div class="celeb" data-act="celebnext"><div class="ct">'+t+'</div><div class="cb">'+big+'</div><div class="cs">'+sub+'</div><div class="ck">Tap to continue</div></div>';
}

/* ---------------- render ---------------- */
var app=document.getElementById('app'),tabs=document.getElementById('tabs');
function render(){
  var html;
  if(S.draft){
    html=(S.draft.phase==='rest'&&S.timer)?rRestScreen():(S.draft.phase==='restover'?rRestoverScreen():rSetScreen());
    if(S.draft.phase==='rest'&&!S.timer){S.draft.phase='set';html=rSetScreen()}
  } else {
    html=(S.view==='today'?rToday():S.view==='week'?rWeek():S.view==='history'?rHistory():rSettings());
  }
  app.innerHTML=html+celebHtml();
  document.body.classList.toggle('workout',!!S.draft);
  var tabsDef=[['today','Today'],['week','Week'],['history','Progress'],['settings','Settings']];
  tabs.innerHTML=tabsDef.map(function(t){
    return '<button class="tab'+(S.view===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'<span class="dot"></span></button>';
  }).join('');
  var ln=document.getElementById('lightnote');
  if(ln){ln.addEventListener('input',function(){lightNote=ln.value})}
}

/* ---------------- actions ---------------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  audio();
  var a=b.dataset.act, ex=b.dataset.ex;

  if(a==='celebnext'){S.celebQueue.shift();save();render();return}
  if(a==='tab'){S.view=b.dataset.v;save();render();return}
  if(a==='start'){startDraft();save();render();return}
  if(a==='canceldraft'){if(confirm('Discard this workout? Sets already marked done will be lost.')){S.draft=null;clearTimer();save();render()}return}
  if(a==='end'){
    var any=S.draft&&S.draft.queue.some(function(s){return s.done});
    if(any||confirm('Nothing logged yet. End without saving?'))finishWorkout();
    return;
  }
  if(a==='wp'||a==='wm'||a==='rp'||a==='rm'||a==='rq'){
    var s=S.draft.queue[ptr()];
    if(a==='wp'||a==='wm'){
      s.w=Math.max(0,Math.round((s.w+(a==='wp'?1:-1))*10)/10);
      S.overrides[s.ex]=s.w;
      S.draft.queue.forEach(function(q){if(!q.done&&q.ex===s.ex)q.w=s.w});
    }
    if(a==='rp'){s.r=Math.min(30,s.r+1);s.entered=true}
    if(a==='rm'){s.r=Math.max(1,s.r-1);s.entered=true}
    if(a==='rq'){s.r=+b.dataset.v;s.entered=true}
    save();render();return;
  }
  if(a==='done'){
    var idx=ptr();
    var s2=S.draft.queue[idx];
    s2.done=true;s2.entered=true;
    try{if('Notification' in window&&Notification.permission==='default'){Notification.requestPermission()}}catch(e2){}
    if(ptr()<0){finishWorkout();return}
    S.draft.phase='rest';
    startRest(s2.ex);
    save();render();return;
  }
  if(a==='addset'){
    var idx2=ptr();
    var cur=S.draft.queue[idx2];
    var lastSame=idx2;
    for(var i=S.draft.queue.length-1;i>=0;i--){if(S.draft.queue[i].ex===cur.ex){lastSame=i;break}}
    S.draft.queue.splice(lastSame+1,0,{ex:cur.ex,w:cur.w,r:cur.r,done:false,entered:false});
    save();render();return;
  }
  if(a==='tplus'){
    if(S.timer){S.timer.endsAt+=30000;S.timer.dur+=30;save();
      cancelPush();schedulePush(S.timer.endsAt);
      render()}
    return;
  }
  if(a==='skip'){if(S.draft)S.draft.phase='set';clearTimer();save();render();return}
  if(a==='go'){if(S.draft)S.draft.phase='set';save();render();return}
  if(a==='chip'){histEx=ex;render();return}
  if(a==='del'){
    var si=+b.dataset.si;
    if(si>=0&&confirm('Delete this session?')){S.sessions.splice(si,1);save();render()}
    return;
  }
  if(a==='lrp'){lightRounds=Math.min(20,lightRounds+1);render();return}
  if(a==='lrm'){lightRounds=Math.max(1,lightRounds-1);render();return}
  if(a==='lmp'){lightMins=Math.min(10,lightMins+1);render();return}
  if(a==='lmm'){lightMins=Math.max(1,lightMins-1);render();return}
  if(a==='loglight'){
    S.sessions.push({ts:Date.now(),type:'light',rounds:lightRounds,minutes:lightMins,note:lightNote.trim()});
    lightNote='';fulfillToday();save();render();return;
  }
  if(a==='bwp'){S.settings.bw=Math.round((S.settings.bw+0.5)*10)/10;save();render();return}
  if(a==='bwm'){S.settings.bw=Math.max(30,Math.round((S.settings.bw-0.5)*10)/10);save();render();return}
  if(a==='restp'){S.settings.rest[ex]=Math.min(600,S.settings.rest[ex]+30);save();render();return}
  if(a==='restm'){S.settings.rest[ex]=Math.max(30,S.settings.rest[ex]-30);save();render();return}
  if(a==='st'){
    var d=+b.dataset.d;
    var cur2=S.schedule[d];
    if(cur2.type==='lifts')S.schedule[d]={type:'bag'};
    else if(cur2.type==='bag')S.schedule[d]={type:'rest'};
    else S.schedule[d]={type:'lifts',ex:['squat','pullup']};
    save();render();return;
  }
  if(a==='sl'){
    var d2=+b.dataset.d,slot=+b.dataset.slot;
    var curL=S.schedule[d2].ex[slot];
    var ni=(ORDER.indexOf(curL)+1)%ORDER.length;
    S.schedule[d2].ex[slot]=ORDER[ni];
    save();render();return;
  }
  if(a==='notif'){
    var st=document.getElementById('notifstatus');
    if(!pushOK()){if(st)st.textContent='Push needs the app installed on the home screen (and the worker deployed).';return}
    (async function(){
      try{
        var p=await Notification.requestPermission();
        if(st)st.textContent='Permission: '+p;
        if(p!=='granted')return;
        var reg=await navigator.serviceWorker.ready;
        var sub=await reg.pushManager.getSubscription();
        if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC)});
        if(st)st.textContent='Push is on. Rest alerts will arrive even locked.';
      }catch(err){if(st)st.textContent='Could not enable: '+err.message}
    })();
    return;
  }
  if(a==='import'){
    document.getElementById('importfile').click();return;
  }
  if(a==='export'){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    var u=URL.createObjectURL(blob);
    var l=document.createElement('a');l.href=u;l.download='forge-export.json';l.click();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);return;
  }
  if(a==='reset'){
    if(confirm('Wipe ALL training data on this device?')){localStorage.removeItem(LS);S={settings:{bw:75,rest:Object.assign({},REST_DEF)},schedule:JSON.parse(JSON.stringify(SCHED_DEF)),sessions:[],draft:null,timer:null,overrides:{},streak:{cur:0,best:0,freezes:0,lastEarned:0,lastCountedK:null,lastCountedTs:0,pwK:null},fulfilledDays:{},celebQueue:[],view:'today'};render()}
    return;
  }
});

document.body.insertAdjacentHTML('beforeend','<input type="file" id="importfile" accept="application/json" style="display:none">');
document.getElementById('importfile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var data=JSON.parse(r.result);
      if(!data||!Array.isArray(data.sessions)||!data.settings)throw new Error('not a FORGE export');
      localStorage.setItem(LS,JSON.stringify(data));
      location.reload();
    }catch(err){alert('Import failed: '+err.message)}
  };
  r.readAsText(f);
});

evalStreak();
if(S.schedule[new Date().getDay()].type==='rest')fulfillToday();
render();
</script>
