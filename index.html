<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>FORGE</title>
<style>
:root{
  --bg:#0a0a0c; --card:#141417; --card2:#1c1c21; --line:#26262c;
  --tx:#f4f4f1; --dim:#8f8f98; --acc:#d8ff4a; --acc-soft:rgba(216,255,74,.12);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;background:var(--bg);color:var(--tx);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
body.workout #app{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
body.workout .tabbar{display:none}

header{padding:30px 6px 20px;display:flex;justify-content:space-between;align-items:baseline}
.brand{font-size:14px;font-weight:800;letter-spacing:.4em}
.brand i{font-style:normal;color:var(--acc)}
.date{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 6px 10px}

.exname{font-size:21px;font-weight:800;letter-spacing:-.01em}
.exsub{font-size:12.5px;color:var(--dim);margin-top:3px}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#0a0a0c;
  background:var(--acc);border-radius:99px;padding:3px 9px;margin-left:8px;vertical-align:2px}
.lastline{margin-top:12px;font-size:13px;color:var(--dim)}
.lastline b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}

.statrow{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:var(--card2);border-radius:14px;padding:12px 14px}
.stat .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}

.btn{width:100%;height:58px;border-radius:16px;font-size:17px;font-weight:800;letter-spacing:.01em}
.btn.acc{background:var(--acc);color:#0a0a0c}
.btn.acc:disabled{opacity:.3}
.btn.ghost{background:none;border:1.5px dashed var(--line);color:var(--dim);font-weight:600}
.btn.dark{background:#0a0a0c;color:var(--acc)}
.btn:active{transform:scale(.985)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.mini{padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);
  font-size:12px;font-weight:700;color:var(--tx);white-space:nowrap}
.mini:active{border-color:var(--acc)}

.hrow{display:flex;align-items:center;gap:12px;padding:15px 2px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:none}
.hrow .d{flex:none;width:92px;white-space:nowrap;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.hrow .s{flex:1;font-size:16.5px;font-weight:700;font-variant-numeric:tabular-nums}
.hrow .s small{font-weight:500;color:var(--dim);font-size:12.5px}
.hrow .del{color:var(--dim);font-size:16px;padding:6px}

.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px;border-top:1px solid var(--line)}
.field:first-child{border-top:none}
.field .fk{font-size:15px;font-weight:600}
.field .fs{font-size:12px;color:var(--dim);margin-top:2px}
.ministep{display:flex;align-items:center;gap:4px}
.ministep button{width:44px;height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px}
.ministep .v{min-width:58px;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

.notein{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;
  color:var(--tx);font:inherit;font-size:15px;padding:14px;margin:10px 0;outline:none}
.notein:focus{border-color:var(--acc)}

.lightchip{display:inline-block;background:var(--card2);border-radius:99px;padding:6px 13px;
  font-size:12.5px;color:var(--dim);margin:0 6px 6px 0;font-variant-numeric:tabular-nums}
.lightchip b{color:var(--acc);font-weight:700}

svg.chart{width:100%;height:auto;display:block;margin:6px 0 2px}
.chart-msg{color:var(--dim);font-size:13px;padding:18px 4px;text-align:center}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:rgba(10,10,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:480px;margin:0 auto;display:flex}
.tab{flex:1;padding:15px 0 17px;text-align:center;font-size:11px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.tab.on{color:var(--acc)}
.tab .dot{display:block;width:4px;height:4px;border-radius:50%;background:var(--acc);margin:5px auto 0;opacity:0}
.tab.on .dot{opacity:1}

.flash{position:fixed;inset:0;background:var(--acc);opacity:0;pointer-events:none;z-index:50;transition:opacity .15s}
.streakbar{display:flex;align-items:baseline;justify-content:space-between;padding:2px 6px 18px}
.streakmain{font-size:22px;font-weight:700}
.streakmain b{font-size:30px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;margin:0 2px}
.streakmain span{font-size:12px;color:var(--dim);font-weight:500;margin-left:4px}
.streaksub{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.celeb{position:fixed;inset:0;background:var(--acc);color:#0a0a0c;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;cursor:pointer}
.celeb .ct{font-size:13px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:rgba(10,10,12,.6)}
.celeb .cb{font-size:64px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:16px 0 10px}
.celeb .cs{font-size:17px;font-weight:600;color:rgba(10,10,12,.75)}
.celeb .ck{position:absolute;bottom:60px;font-size:11px;font-weight:800;letter-spacing:.24em;color:rgba(10,10,12,.5)}
.errbox{position:fixed;left:8px;right:8px;bottom:90px;background:#2a0d0d;color:#ff9d9d;
  font:11px/1.4 monospace;padding:10px;border-radius:8px;z-index:99;white-space:pre-wrap}

/* ---- v3: set-focused workout ---- */
.hero{padding:34px 4px 0;text-align:center}
.herolab{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.herolab b{color:var(--tx)}
.pdots{display:flex;gap:7px;justify-content:center;margin:16px 0 4px}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pdot.done{background:var(--acc)}
.pdot.cur{background:var(--tx)}
.pdot.skip{background:none;border:1.5px solid var(--dim);width:6px;height:6px}
.wedit{display:flex;align-items:center;justify-content:center;gap:16px;margin:22px 0 4px}
.wedit button{flex:none;width:56px;height:56px;border-radius:16px;background:var(--card2);
  border:1px solid var(--line);font-size:26px;font-weight:600;display:grid;place-items:center}
.wedit button:active{background:var(--acc-soft)}
.bigw{font-size:82px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.bigw small{font-size:22px;font-weight:500;color:var(--dim);margin-left:6px}
.herolast{font-size:13px;color:var(--dim);margin:8px 0 26px;min-height:18px}
.herolast b{color:var(--tx)}
.replab{font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.repgrid{display:flex;gap:5px;margin-bottom:16px}
.repb{flex:1;height:58px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
  font-size:19px;font-weight:800;color:var(--tx);padding:0}
.repb:active{background:var(--acc-soft)}
.repb.on{background:var(--acc);color:#0a0a0c;border-color:var(--acc)}
.repb.side{flex:0 0 40px;color:var(--dim);font-size:22px;font-weight:500}
.linkrow{display:flex;justify-content:center;gap:26px;margin-top:20px}
.linkrow button{color:var(--dim);font-size:13px;font-weight:600;padding:8px 4px}
.linkrow button:active{color:var(--tx)}

.clock{font-size:96px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;margin:18px 0 4px}
.nextcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin:26px 0 18px;text-align:left}
.nextcard .nl{font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.nextcard .nn{font-size:20px;font-weight:800;margin-top:4px}
.nextcard .nw{font-size:14px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}

.overcard{background:var(--acc);color:#0a0a0c;border-radius:var(--r);padding:30px 22px;margin-top:60px;text-align:center}
.overcard .ot{font-size:30px;font-weight:800;letter-spacing:.02em}
.overcard .os{font-size:14px;margin:8px 0 20px;color:rgba(10,10,12,.7);font-weight:600}

.wrow{display:flex;align-items:center;gap:12px;padding:15px 2px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:none}
.wrow .wd{flex:none;width:44px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.wrow .wc{flex:1;font-size:15.5px;font-weight:700}
.wrow .wc small{color:var(--dim);font-weight:500}
.wrow .tag{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--acc)}
.wrow .tick{color:var(--acc);font-weight:800}
.wrow.future .wc{color:var(--dim)}


/* ---- v6 visual system: quiet performance ---- */
:root{--bg:#050607;--card:#151715;--card2:#202320;--line:rgba(255,255,255,.075);--tx:#f5f6f2;--dim:#979b94;--acc:#a9f75f;--acc-soft:rgba(169,247,95,.12);--r:26px;--mut:#979b94}
*{-webkit-tap-highlight-color:transparent}html{background:var(--bg);color-scheme:dark}body{min-height:100dvh;background:radial-gradient(90% 38% at 50% -8%,rgba(169,247,95,.075),transparent 65%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased}button,input{touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:3px}#app{max-width:520px;padding:0 20px calc(112px + env(safe-area-inset-bottom))}body.workout #app{padding:0 20px calc(22px + env(safe-area-inset-bottom))}
header{padding:calc(25px + env(safe-area-inset-top)) 1px 25px;align-items:center}.brand{font-size:15px;font-weight:850;letter-spacing:.31em}.brand i{color:var(--acc)}.date{font-size:11px;letter-spacing:.1em;font-weight:700;color:#898d86}.eyebrow{margin:4px 3px 11px;font-size:10px;font-weight:750;letter-spacing:.18em;color:#858981}
.card{background:linear-gradient(145deg,rgba(27,30,27,.96),rgba(18,20,18,.97));border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:14px;box-shadow:0 24px 60px rgba(0,0,0,.20)}.exname{font-size:23px;font-weight:720;letter-spacing:-.032em}.exsub{font-size:13px;line-height:1.45;color:#979b94;margin-top:6px}.lastline{font-size:13px;line-height:1.55;color:#8f938c;margin-top:16px}.lastline b{color:#e7e9e4;font-weight:650}.badge{background:var(--acc);font-size:9px;padding:5px 8px;vertical-align:3px}
.streakbar{margin:0 0 22px;padding:18px 19px;border:1px solid rgba(169,247,95,.14);border-radius:22px;background:linear-gradient(135deg,rgba(169,247,95,.11),rgba(255,255,255,.025));align-items:center}.streakmain{font-size:0}.streakmain:first-letter{font-size:16px}.streakmain b{font-size:43px;letter-spacing:-.055em;margin:0 7px;color:var(--acc)}.streakmain span{font-size:10px;font-weight:750;letter-spacing:.11em;text-transform:uppercase}.streaksub{font-size:10px;line-height:1.55;text-transform:uppercase;letter-spacing:.055em}
.btn{min-height:62px;height:auto;border-radius:18px;font-size:15px;font-weight:730;letter-spacing:-.01em;transition:transform .15s}.btn.acc{background:#f0f2ed;color:#090b09;box-shadow:0 12px 30px rgba(0,0,0,.25)}.btn.ghost{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.025);color:#aaaea7}.btn.dark{background:#0b0e09;color:var(--acc)}.btn:active{transform:scale(.98)}
.statrow{gap:8px}.stat{border:1px solid rgba(255,255,255,.045);border-radius:16px;background:rgba(255,255,255,.04);padding:13px}.stat .k{font-size:9px;font-weight:750;letter-spacing:.14em}.stat .v{font-size:19px;font-weight:700;letter-spacing:-.03em}.chips{gap:8px}.chip{min-height:44px;border:1px solid rgba(255,255,255,.09);font-size:12px}.chip.on{border-color:rgba(169,247,95,.6);background:var(--acc-soft);color:#c8ff94}.mini{min-height:44px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025)}
.tabbar{background:rgba(8,9,8,.84);border-color:rgba(255,255,255,.065);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}.tabbar .in{max-width:520px;padding:5px 10px 3px}.tab{min-height:64px;font-size:9px;font-weight:750;letter-spacing:.14em}.tab.on{color:#d5ffae}.tab .dot{width:5px;height:5px;margin-top:7px;box-shadow:0 0 12px rgba(169,247,95,.7)}
.hrow{min-height:64px}.hrow .del{min-width:44px;min-height:44px}.field{min-height:72px}.field .fk{font-weight:650}.field .fs{line-height:1.4}.ministep button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.055)}.notein{min-height:52px;background:rgba(255,255,255,.05)}
/* active set hero */
.hero{min-height:100dvh;padding:calc(26px + env(safe-area-inset-top)) 0 18px;display:flex;flex-direction:column;text-align:center}.herolab{font-size:11px;font-weight:750;letter-spacing:.18em;color:#8e928b}.herolab b{display:block;font-size:28px;letter-spacing:-.035em;text-transform:none;color:var(--tx);margin-bottom:7px}.pdots{gap:5px;margin:19px 0 0}.pdot{height:3px;flex:1;max-width:56px;width:auto;border-radius:3px}.pdot.done{background:var(--acc)}.pdot.cur{background:linear-gradient(90deg,var(--acc) 42%,var(--line) 42%)}
.wedit{margin:clamp(40px,8vh,72px) 0 0;gap:15px}.wedit button{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.055);font-size:23px}.bigw{font-size:clamp(110px,31vw,138px);font-weight:720;letter-spacing:-.08em}.bigw small{display:block;font-size:12px;letter-spacing:.13em;text-transform:uppercase;margin:17px 0 0}.herolast{margin:20px 0 auto;min-height:20px}.replab{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:none;margin:0 3px 11px}.repgrid{gap:5px}.repb{height:50px;border-radius:13px;background:rgba(255,255,255,.045);font-size:17px}.repb.side{flex-basis:42px}.repb.on{background:var(--acc);color:#071005}.hero>.btn.acc{margin-top:2px}.linkrow{gap:0;margin-top:10px}.linkrow button{min-height:44px;padding:10px 13px;font-size:11px}.linkrow button:first-child{margin-left:auto}.linkrow button:last-child{margin-right:auto}
/* rest is the same hero, number becomes countdown */
.restHero .herolab b{display:inline;font-size:inherit;letter-spacing:.18em;text-transform:uppercase}.restStatus{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;color:#8c9089;font-size:12px}.liveDot{width:8px;height:8px;border:2px solid var(--acc);border-radius:50%;box-shadow:0 0 13px rgba(169,247,95,.6)}.clock{font-size:clamp(126px,36vw,158px);font-weight:700;letter-spacing:-.085em;margin:clamp(58px,11vh,96px) 0 18px}.timerActions{display:flex;justify-content:center;gap:10px}.timerActions .mini{min-width:78px}.nextcard{margin:auto 0 15px;padding:20px;border-radius:24px;background:linear-gradient(145deg,rgba(29,32,29,.96),rgba(18,20,18,.97));box-shadow:none}.nextcard .nl{font-weight:700}.nextcard .nn{font-size:20px;letter-spacing:-.025em}.nextcard .nw{font-size:13px}
.overcard{margin-top:25vh;border-radius:28px;background:var(--acc)}
/* celebration as an event */
.celeb{background:radial-gradient(circle at 50% 28%,#cfff9f 0,#a9f75f 45%,#8bdd43 100%);color:#071005;padding:32px;overflow:hidden}.celeb:before,.celeb:after{content:"";position:absolute;border:1px solid rgba(7,16,5,.14);border-radius:50%}.celeb:before{width:430px;height:430px;top:-110px}.celeb:after{width:610px;height:610px;top:-200px}.celeb .ct{position:relative;z-index:1;font-size:11px;letter-spacing:.24em;color:rgba(7,16,5,.62)}.celeb .cb{position:relative;z-index:1;font-size:clamp(65px,19vw,86px);font-weight:760;letter-spacing:-.065em;line-height:.95;max-width:360px}.celeb .cs{position:relative;z-index:1;max-width:300px;font-size:16px;line-height:1.45}.celeb .ck{z-index:1;bottom:48px;background:rgba(7,16,5,.10);padding:13px 20px;border-radius:22px;color:rgba(7,16,5,.65)}
.celeb .cb .wu{font-size:.62em;letter-spacing:-.045em;font-variant-numeric:tabular-nums;white-space:nowrap}
.celeb .cb .wu small{font-size:.45em;font-weight:650;letter-spacing:0;margin-left:8px;color:rgba(7,16,5,.55)}
.celeb .wul{position:relative;z-index:1;margin-top:24px;width:100%;max-width:320px;text-align:left}
.celeb .wul .wr{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 2px;border-top:1px solid rgba(7,16,5,.16);font-size:15px}
.celeb .wul .wr span{color:rgba(7,16,5,.62);font-weight:650}
.celeb .wul .wr b{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.finishach{margin:0 0 16px;font-size:13px;font-weight:700;color:var(--acc);line-height:1.5}
.wrow{min-height:72px}.wrow .tag{background:var(--acc-soft);padding:5px 7px;border-radius:8px}.chart{margin-top:15px}.chart polyline{stroke:var(--acc)!important}.chart circle{fill:var(--acc)!important}.chart-msg{line-height:1.5}
@media(max-width:380px){#app,body.workout #app{padding-left:14px;padding-right:14px}.bigw{font-size:105px}.repgrid{gap:3px}.repb.side{flex-basis:36px}.stat .v{font-size:17px}}
/* workout complete */
.finish{min-height:100dvh;padding:calc(50px + env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;text-align:center}
.finishdur{font-size:clamp(82px,24vw,108px);font-weight:740;letter-spacing:-.075em;line-height:.95;margin:clamp(76px,14vh,118px) 0 11px;font-variant-numeric:tabular-nums}
.finishlabel{font-size:10px;font-weight:750;letter-spacing:.22em;color:var(--dim)}
.finishtimes{display:flex;align-items:center;justify-content:center;gap:18px;margin:auto 0 34px}
.finishtimes div{display:flex;flex-direction:column;gap:7px;min-width:92px}.finishtimes span{font-size:9px;font-weight:750;letter-spacing:.18em;color:var(--dim)}.finishtimes b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.finishtimes i{width:38px;height:1px;background:var(--line)}
.finish .statrow{margin-bottom:14px}.finish .btn{width:100%}
.hrow .s .hdur{display:block;margin-top:4px;color:var(--dim);font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}


/* v6: today hero + progress story */
#app.appcol{display:flex;flex-direction:column;min-height:100dvh}
.idline{display:flex;align-items:baseline;gap:8px;margin:-8px 1px 0;font-size:11px;color:#858981}
.idline .fl{font-size:13px}
.idline b{color:var(--acc);font-size:16px;font-weight:800;letter-spacing:-.02em}

<body class="">
<div id="app"></div>
<nav class="tabbar"><div class="in" id="tabs"></div></nav>

<script>
'use strict';
window.addEventListener('error',function(e){
  var d=document.createElement('div');d.className='errbox';d.textContent=String(e.message||e.error);
  document.body.appendChild(d);
});

/* ---------------- config ---------------- */
var WORKER_URL='https://forge-push.roi-butbul22.workers.dev'; /* set at deploy */
var VAPID_PUBLIC='BFCyyYGhqex5y0MwhbJObDded2KpHlPcnIUu6DWtsAFg9C0Vz14EmThbJH9HOdpHL4s1SZU6G9cPmB_NXyoEMhA';

/* ---------------- state ---------------- */
var LS='forge.v1';
var EX={
  squat:   {name:'Squat',             kind:'bar', inc:2.5, seed:65, note:'RIR 1-2 per set'},
  pullup:  {name:'Weighted Pull-Up',  kind:'bw',  inc:2.5, add:10,  note:'to failure is fine'},
  deadlift:{name:'Deadlift',          kind:'bar', inc:2.5, seed:95, note:'RIR 1-2 per set'},
  press:   {name:'Standing DB Press', kind:'db',  inc:2,   seed:20, note:'weight per dumbbell'},
  dips:    {name:'Weighted Dips',     kind:'bw',  inc:2.5, add:10,  note:'to failure is fine'}
};
var ORDER=['squat','pullup','deadlift','press','dips'];
var REST_DEF={squat:180,pullup:180,deadlift:240,press:120,dips:180};
var DAYN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
var SCHED_DEF={
  0:{type:'lifts',ex:['squat','pullup']},
  1:{type:'lifts',ex:['deadlift','press']},
  2:{type:'lifts',ex:['dips','squat']},
  3:{type:'lifts',ex:['pullup','deadlift']},
  4:{type:'lifts',ex:['press','dips']},
  5:{type:'bag'},
  6:{type:'rest'}
};

function load(){ try{var s=JSON.parse(localStorage.getItem(LS)); if(s&&s.sessions)return s;}catch(e){} return null; }
var S=load()||{settings:{bw:75,rest:{}},schedule:null,sessions:[],draft:null,timer:null,view:'today'};
if(!S.settings)S.settings={bw:75,rest:{}};
if(!S.settings.rest)S.settings.rest={};
ORDER.forEach(function(id){if(typeof S.settings.rest[id]!=='number')S.settings.rest[id]=REST_DEF[id]});
if(!S.settings.inc)S.settings.inc={};
ORDER.forEach(function(id){if(typeof S.settings.inc[id]!=='number')S.settings.inc[id]=EX[id].inc});
if(!S.schedule)S.schedule=JSON.parse(JSON.stringify(SCHED_DEF));
for(var di=0;di<7;di++)if(!S.schedule[di])S.schedule[di]=JSON.parse(JSON.stringify(SCHED_DEF[di]));
if(typeof S.timer==='undefined')S.timer=null;
if(!S.overrides)S.overrides={};
if(!S.streak)S.streak={cur:0,best:0,freezes:0,lastEarned:0,lastCountedK:null,lastCountedTs:0,pwK:null};
if(!S.fulfilledDays)S.fulfilledDays={};
if(!S.celebQueue)S.celebQueue=[];
if(!S.weekRepl)S.weekRepl={}; /* v8: per-day exercise replace, this week only - replaces the day-swap Move */
if(typeof S.weekSwaps!=='undefined')delete S.weekSwaps; /* v8: day-swap Move removed; any in-flight swap reverts to the permanent program */
var replPick=null;
if(typeof S.shift!=='undefined')delete S.shift; /* v5.5: shift model removed - makeup is same-day, the program never moves */
if(!S.releasedDays)S.releasedDays={}; /* v5.4: missed days the user chose to drop */
if(S.draft&&!S.draft.queue){S.draft=null;S.timer=null} /* v2 draft shape: discard */
function save(){ localStorage.setItem(LS,JSON.stringify(S)); }

var histEx='squat';
var lightRounds=5, lightMins=3, lightNote='';

/* ---------------- helpers ---------------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function fmtW(w){return (Math.round(w*10)/10).toString()}
function fmtT(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s}
function fmtClock(ts){return new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function fmtDuration(ms){var mins=Math.max(0,Math.round(ms/60000));var h=Math.floor(mins/60),m=mins%60;return h?(h+'h '+(m?m+'m':'')).trim():m+' min'}
function num(n){return n.toLocaleString('en-GB')}

function mainSessions(){return S.sessions.filter(function(s){return s.type==='main'})}
function lastEntry(exId){
  var ms=mainSessions();
  for(var i=ms.length-1;i>=0;i--){
    var en=ms[i].entries.find(function(e){return e.exId===exId});
    if(en&&en.sets.length)return {sets:en.sets,ts:ms[i].ts};
  }
  return null;
}
function seedW(exId){var e=EX[exId];return e.kind==='bw'?e.add:e.seed}
function incOf(exId){return (S.settings.inc&&typeof S.settings.inc[exId]==='number')?S.settings.inc[exId]:EX[exId].inc}
function target(exId){
  var last=lastEntry(exId);
  if(S.overrides&&typeof S.overrides[exId]==='number')return {w:S.overrides[exId],add:false,last:last};
  if(!last)return {w:seedW(exId),add:false,last:null};
  var all8=last.sets.every(function(s){return s.r>=8});
  return {w:all8?Math.round((last.sets[0].w+incOf(exId))*10)/10:last.sets[0].w, add:all8, last:last};
}
function breakdown(exId,w){
  var e=EX[exId];
  if(e.kind!=='bw')return '';
  return 'BW '+fmtW(S.settings.bw)+' + '+fmtW(w)+' = '+fmtW(Math.round((S.settings.bw+w)*10)/10);
}
function dispW(exId,w){return (EX[exId]&&EX[exId].kind==='bw'?'+':'')+fmtW(w)}
function setsStr(exId,sets){return dispW(exId,sets[0].w)+' x '+sets.map(function(s){return s.r}).join(', ')}
function e1rm(w,r){return w*(1+r/30)}
function tonnage(entries){var t=0;var bw=(S.settings&&S.settings.bw)?S.settings.bw:0;entries.forEach(function(e){e.sets.forEach(function(s){t+=(s.w+bw)*s.r})});return Math.round(t)}
function schedText(d){
  var s=S.schedule[d];
  if(s.type==='bag')return 'Heavy bag';
  if(s.type==='rest')return 'Rest';
  return s.ex.map(function(id){return EX[id].name}).join(' + ');
}
function schedObjText(s){
  if(s.type==='bag')return 'Heavy bag';
  if(s.type==='rest')return 'Rest';
  return s.ex.map(function(id){return EX[id].name}).join(' + ');
}
/* v5.5: schedule is always the original weekday layout - no shift */
function weekKey(dt){var d=new Date(dt);d.setHours(12,0,0,0);d.setDate(d.getDate()-d.getDay());return dayKey(d.getTime())}
function scheduleForKey(dt){var wk=weekKey(dt),plan=S.weekRepl&&S.weekRepl[wk],k=dayKey(dt.getTime());if(plan&&plan[k]&&S.schedule[dt.getDay()].type==='lifts')return{type:'lifts',ex:plan[k].ex.slice()};return S.schedule[dt.getDay()]}
function replForDay(dt){var wk=weekKey(dt),plan=S.weekRepl&&S.weekRepl[wk],k=dayKey(dt.getTime());return plan&&plan[k]?plan[k]:null}
function schedFor(dt){return scheduleForKey(dt)}
function cloneSched(x){return JSON.parse(JSON.stringify(x))}
function parseDayKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1],p[2],12)}
/* v8: replace a lifts day's two exercises for this week only; the permanent program in Settings is untouched */
function replaceWeekDay(k,exPair){var d=parseDayKey(k),wk=weekKey(d);if(S.schedule[d.getDay()].type!=='lifts')return;if(!S.weekRepl[wk])S.weekRepl[wk]={};S.weekRepl[wk][k]={ex:exPair.slice(),was:S.schedule[d.getDay()].ex.slice()};replPick=null;save()}
function undoWeekDay(k){var d=parseDayKey(k),wk=weekKey(d);if(S.weekRepl&&S.weekRepl[wk]){delete S.weekRepl[wk][k];if(!Object.keys(S.weekRepl[wk]).length)delete S.weekRepl[wk]}save()}
/* v5.5: yesterday is makeup-eligible while it is a missed lifts day, not yet counted by the streak, not dropped */
function catchUpPending(){
  var y=new Date();y.setDate(y.getDate()-1);
  var yK=dayKey(y.getTime());
  if(S.streak&&S.streak.lastCountedK===yK)return false;
  if(S.fulfilledDays[yK])return false;
  if(S.releasedDays&&S.releasedDays[yK])return false;
  if(schedFor(y).type!=='lifts')return false;
  if(S.sessions.some(function(s){return s.type==='main'&&dayKey(s.ts)===yK}))return false;
  return yK;
}

/* ---------------- rest timer ---------------- */
function rem(){if(!S.timer)return 0;return Math.max(0,Math.ceil((S.timer.endsAt-Date.now())/1000))}
function startRest(ex){
  var d=S.settings.rest[ex]||180;
  S.timer={ex:ex,dur:d,endsAt:Date.now()+d*1000,fired:false,pid:null};
  save();grabWake();
  schedulePush(S.timer.endsAt);
}
function clearTimer(){
  cancelPush();
  S.timer=null;dropWake();save();
}

var wakeLock=null;
function grabWake(){try{if('wakeLock' in navigator){navigator.wakeLock.request('screen').then(function(l){wakeLock=l}).catch(function(){})}}catch(e){}}
function dropWake(){try{if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null}}catch(e){}}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&S.timer&&!S.timer.fired&&rem()>0)grabWake();
});

var AC=null;
function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){
  try{
    audio();if(!AC)return;
    var t0=AC.currentTime+0.03;
    for(var i=0;i<3;i++){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t0+i*0.3);
      g.gain.exponentialRampToValueAtTime(0.5,t0+i*0.3+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.3+0.2);
      o.connect(g);g.connect(AC.destination);
      o.start(t0+i*0.3);o.stop(t0+i*0.3+0.22);
    }
  }catch(e){}
}
function flash(){
  var f=document.getElementById('flash');if(!f)return;
  f.style.opacity='0.5';
  setTimeout(function(){f.style.opacity='0'},200);
  setTimeout(function(){f.style.opacity='0.35';setTimeout(function(){f.style.opacity='0'},200)},350);
}
setInterval(function(){
  if(S.draft&&S.draft.away){var ae=document.getElementById('awayelapsed');if(ae)ae.textContent=fmtT(Math.floor((Date.now()-S.draft.ts)/1000))}
  if(!S.timer)return;
  var r=rem();
  var el=document.getElementById('ttime');
  if(el)el.textContent=fmtT(r);
  if(r<=0&&!S.timer.fired){
    S.timer.fired=true;
    var late=(Date.now()-S.timer.endsAt)>10000;
    dropWake();beep();
    try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}
    flash();
    S.timer=null;
    if(S.draft)S.draft.phase=late?'restover':'set';
    save();render();
  }
},500);

/* ---------------- web push (v4) ---------------- */
function pushOK(){
  return WORKER_URL.indexOf('YOUR-SUBDOMAIN')<0 &&
    'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function urlB64ToUint8Array(base64String){
  var padding='='.repeat((4-base64String.length%4)%4);
  var base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  var raw=atob(base64);var out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
function schedulePush(endsAt){
  if(!pushOK())return;
  (async function(){
    try{
      if(Notification.permission==='default'){
        var p=await Notification.requestPermission();
        if(p!=='granted')return;
      }
      if(Notification.permission!=='granted')return;
      var reg=await navigator.serviceWorker.ready;
      var sub=await reg.pushManager.getSubscription();
      if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC)});
      var id='t'+Date.now();
      if(S.timer)S.timer.pid=id;
      await fetch(WORKER_URL+'/schedule',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:id,fireAt:endsAt,subscription:sub.toJSON()})});
      save();
    }catch(e){}
  })();
}
function cancelPush(){
  try{
    if(S.timer&&S.timer.pid&&pushOK()){
      fetch(WORKER_URL+'/schedule?id='+encodeURIComponent(S.timer.pid),{method:'DELETE'}).catch(function(){});
    }
  }catch(e){}
}

/* ---------------- streak engine (v5) ---------------- */
function queueCeleb(c){S.celebQueue.push(c);if(S.celebQueue.length>5)S.celebQueue=S.celebQueue.slice(-5)}
function earnFreezes(st){
  while(st.cur>=st.lastEarned+14){
    if(st.freezes<2)st.freezes++;
    st.lastEarned+=14;
  }
}
function bumpStreak(st){
  st.cur++;
  if(st.cur>st.best)st.best=st.cur;
  earnFreezes(st);
  if([7,14,30,50,100].indexOf(st.cur)>=0)queueCeleb({type:'milestone',n:st.cur});
}
function evalStreak(){
  var st=S.streak;
  if(!st.settled)st.settled={}; /* v5.5: per-day settled record, so a day jumped over by a same-day double still gets settled later */
  var todayK=dayKey(Date.now());
  var y=new Date();y.setDate(y.getDate()-1);
  /* v5.5: while a makeup is pending, yesterday stays uncounted - the streak waits for his choice (no freeze burn until released or expired) */
  var pendK=catchUpPending();
  var stopK=pendK||todayK;
  if(!st.lastCountedK){var dby=new Date(y);dby.setDate(dby.getDate()-1);st.lastCountedK=dayKey(dby.getTime());st.lastCountedTs=dby.getTime();save();return}
  var cursor=new Date(st.lastCountedTs);cursor.setDate(cursor.getDate()+1);
  var guard=0;
  while(dayKey(cursor.getTime())!==stopK&&guard++<400){
    var k=dayKey(cursor.getTime());
    if(!st.settled[k]){
      var sched=schedFor(cursor);
      var ok=(sched.type==='rest')||!!S.fulfilledDays[k];
      if(ok){bumpStreak(st)}
      else if(st.freezes>0){st.freezes--;bumpStreak(st);queueCeleb({type:'freeze',cur:st.cur})}
      else{st.cur=0;st.lastEarned=0}
      st.settled[k]=true;
    }
    cursor.setDate(cursor.getDate()+1);
  }
  /* v5.5: advance the watermark only over contiguous settled days, never past the pending day or today */
  var wm=new Date(st.lastCountedTs);var g2=0;
  while(g2++<400){
    var nd=new Date(wm);nd.setDate(nd.getDate()+1);
    var nk=dayKey(nd.getTime());
    if(nk===stopK||nk===todayK)break;
    if(!st.settled[nk])break;
    wm=nd;
  }
  st.lastCountedK=dayKey(wm.getTime());st.lastCountedTs=wm.getTime();
  save();
}
function fulfillToday(){
  evalStreak();
  var k=dayKey(Date.now());
  if(S.fulfilledDays[k])return false;
  S.fulfilledDays[k]=true;
  var st=S.streak;
  if(!st.settled)st.settled={};
  if(!st.settled[k]){bumpStreak(st);st.settled[k]=true}
  checkPerfectWeek();
  save();
  return true;
}
function checkPerfectWeek(){
  var now=new Date();
  if(now.getDay()!==6)return;
  var st=S.streak;
  var ws=new Date(now);ws.setDate(ws.getDate()-6);
  var wk=dayKey(ws.getTime());
  if(st.pwK===wk)return;
  for(var i=0;i<7;i++){
    var dt=new Date(ws);dt.setDate(ws.getDate()+i);
    var k=dayKey(dt.getTime());
    if(!(schedFor(dt).type==='rest'||S.fulfilledDays[k]))return;
  }
  st.pwK=wk;
  queueCeleb({type:'perfectweek'});
}
function weekStats(){
  var now=new Date();
  var ws=new Date(now);ws.setDate(ws.getDate()-ws.getDay());
  var done=0,total=0;
  for(var i=0;i<=now.getDay();i++){
    var dt=new Date(ws);dt.setDate(ws.getDate()+i);
    total++;
    var k=dayKey(dt.getTime());
    if(schedFor(dt).type==='rest'||S.fulfilledDays[k])done++;
  }
  return {done:done,total:total};
}

/* v5.1: one-time backfill - existing logged sessions must count toward the streak */
function migrate51(){
  var st=S.streak;
  if(st.v51)return;
  st.v51=1;
  S.sessions.forEach(function(sn){if(sn&&sn.ts)S.fulfilledDays[dayKey(sn.ts)]=true});
  var todayK=dayKey(Date.now());
  var yD=new Date();yD.setDate(yD.getDate()-1);var yK=dayKey(yD.getTime());
  var todayCounted=(S.schedule[new Date().getDay()].type==='rest')||!!S.fulfilledDays[todayK];
  var run=0;var d=new Date();var guard=0;
  while(guard++<400){
    var k=dayKey(d.getTime());
    var sched=S.schedule[d.getDay()];
    if(sched.type==='rest'||S.fulfilledDays[k]){run++;d.setDate(d.getDate()-1)}else break;
  }
  if(run>st.cur){
    st.cur=run;
    st.lastEarned=run-(run%14);
    st.freezes=Math.min(2,Math.floor(run/14));
    st.lastCountedK=todayCounted?todayK:yK;st.lastCountedTs=Date.now();
  }else if(!st.lastCountedK){
    st.lastCountedK=yK;st.lastCountedTs=yD.getTime();
  }else if(todayCounted&&st.lastCountedK!==todayK){
    bumpStreak(st);st.lastCountedK=todayK;st.lastCountedTs=Date.now();checkPerfectWeek();
  }
  if(st.cur>st.best)st.best=st.cur;
  save();
}

/* v5.2: dips/pull-ups are tracked as ADDED weight only.

   conversion screen. NOTE: approximate for old sessions if bodyweight has changed since. */
function needsMig52(){
  if(S.v52)return false;
  var has=S.sessions.some(function(sn){return sn.type==='main'&&sn.entries.some(function(e){return EX[e.exId]&&EX[e.exId].kind==='bw'})});
  if(!has&&S.overrides&&['pullup','dips'].some(function(id){return typeof S.overrides[id]==='number'}))has=true;
  if(!has&&S.draft&&S.draft.queue&&S.draft.queue.some(function(q){return EX[q.ex]&&EX[q.ex].kind==='bw'}))has=true;
  return has;
}
function migrate52(){
  if(S.v52)return;
  if(needsMig52()){S.view='mig52';save();return}
  S.v52=1;save();
}
function doMig52(){
  var bw=S.settings.bw||0;
  S.sessions.forEach(function(sn){
    if(sn.type!=='main')return;
    sn.entries.forEach(function(e){
      if(EX[e.exId]&&EX[e.exId].kind==='bw')e.sets.forEach(function(s){s.w=Math.round((s.w-bw)*10)/10});
    });
  });
  ['pullup','dips'].forEach(function(id){if(S.overrides&&typeof S.overrides[id]==='number')S.overrides[id]=Math.round((S.overrides[id]-bw)*10)/10});
  if(S.draft&&S.draft.queue)S.draft.queue.forEach(function(q){if(EX[q.ex]&&EX[q.ex].kind==='bw')q.w=Math.round((q.w-bw)*10)/10});
  S.v52=1;

  save();
}

function startDraft(){

  sched.ex.forEach(function(id){
    var t=target(id);

    var nSets=t.last?t.last.sets.length:3;
    for(var i=0;i<nSets;i++)queue.push({ex:id,w:t.w,r:reps,done:false,entered:false});
  });
  S.draft={ts:Date.now(),day:d,queue:queue,phase:'set'};
  save();
}

}

function ptr(){
  if(!S.draft)return -1;
  for(var i=0;i<S.draft.queue.length;i++)if(!S.draft.queue[i].done&&!S.draft.queue[i].skipped)return i;
  return -1;
}
function setInfo(idx){
  var q=S.draft.queue,ex=q[idx].ex,k=0,n=0;
  for(var i=0;i<q.length;i++){if(q[i].ex===ex){n++;if(i<=idx)k++}}
  return {k:k,n:n};
}
function finishWorkout(){
  if(!S.draft)return;
  var makeupK=S.draft.makeupK||null,makeupTs=S.draft.makeupTs||null;
  var doneN=0,skipN=0;
  S.draft.queue.forEach(function(s){if(s.done)doneN++;else if(s.skipped)skipN++});
  var entries=[];
  var skipped=[];
  S.draft.queue.forEach(function(s){
    if(s.skipped){skipped.push({exId:s.ex,w:s.w,r:s.r});return}
    if(!s.done)return;
    var last=entries[entries.length-1];
    if(last&&last.exId===s.ex)last.sets.push({w:s.w,r:s.r});
    else entries.push({exId:s.ex,sets:[{w:s.w,r:s.r}]});
  });
  if(entries.length){
    /* celebrations computed against pre-session history */
    var wuLifts=[],wuPrs=[];
    entries.forEach(function(e){
      var all8=e.sets.length>0&&e.sets.every(function(s){return s.r>=8});
      if(all8)wuLifts.push({ex:e.exId,from:e.sets[0].w,to:Math.round((e.sets[0].w+incOf(e.exId))*10)/10});
      e.sets.forEach(function(s){
        var best=0;
        mainSessions().forEach(function(ms){
          ms.entries.forEach(function(en){
            if(en.exId!==e.exId)return;
            en.sets.forEach(function(ps){if(ps.w===s.w&&ps.r>best)best=ps.r});
          });
        });
        if(best>0&&s.r>best)wuPrs.push({type:'reppr',ex:e.exId,w:s.w,r:s.r});
      });
    });
    /* weight-up earns the peak moment: one grouped celebration, ahead of rep PRs */
    if(wuLifts.length)queueCeleb({type:'weightup',lifts:wuLifts});
    wuPrs.forEach(queueCeleb);
    var endAt=Date.now(),startAt=S.draft.ts||endAt;
    var sess={ts:endAt,type:'main',entries:entries,startAt:startAt,endAt:endAt,durationMs:Math.max(0,endAt-startAt)};
    if(skipped.length)sess.skipped=skipped; /* v5.3: skipped = not attempted */
    if(makeupTs)sess.makeupFor=makeupTs; /* v5.4 */
    S.sessions.push(sess);
    S.summary=sess;
  }
  entries.forEach(function(e){delete S.overrides[e.exId]});
  S.draft=null;clearTimer();
  /* v5.5: a completed makeup rescues the missed day - the program never shifts */
  /* v5.3: a partial workout (any set logged) counts as a training day */
  if(doneN>0){if(makeupK)S.fulfilledDays[makeupK]=true;fulfillToday()}
  S.view='today';save();render();
}

/* ---------------- progress ---------------- */
function sparkline(pts,w,h){
  w=w||76;h=h||30;
  if(pts.length<2)return '';
  var pad=2,mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),rng=(mx-mn)||1;
  var step=(w-2*pad)/(pts.length-1);
  var coords=pts.map(function(v,i){return [pad+i*step, h-pad-((v-mn)/rng)*(h-2*pad)]});
  var line=coords.map(function(c){return c[0].toFixed(1)+','+c[1].toFixed(1)}).join(' ');
  var s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">';
  s+='<polyline points="'+line+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  var last=coords[coords.length-1];
  s+='<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.8" fill="var(--acc)"/>';
  return s+'</svg>';
}
function topSetPerSession(exId){
  /* one e1rm point per session that logged the lift (best set of the day) */
  var pts=[],rows=[];
  mainSessions().forEach(function(s){
    var en=s.entries.find(function(e){return e.exId===exId});
    if(!en||!en.sets.length)return;
    var m=en.sets[0];en.sets.forEach(function(x){if(e1rm(x.w,x.r)>e1rm(m.w,m.r))m=x});
    pts.push(e1rm(m.w,m.r));rows.push({ts:s.ts,w:m.w});
  });
  return {pts:pts,rows:rows};
}
function progressStory(){
  var now=new Date();
  var startThis=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  var startPrev=new Date(now.getFullYear(),now.getMonth()-1,1).getTime();
  var prevName=new Date(startPrev).toLocaleDateString('en-GB',{month:'long'});
  var curT=0,prevT=0,sessN=0;
  mainSessions().forEach(function(s){
    var t=tonnage(s.entries);
    if(s.ts>=startThis){curT+=t;sessN++}
    else if(s.ts>=startPrev){prevT+=t}
  });
  var tonnes=Math.round(curT/100)/10;
  var h='<div class="phero"><div class="eyebrow">'+esc(new Date(startThis).toLocaleDateString('en-GB',{month:'long'}))+' so far</div>';
  h+='<div class="bignum">'+tonnes+'<small>TONNES</small></div>';
  if(prevT>0){
    var pct=Math.round((curT-prevT)/prevT*100);
    h+='<div class="pdelta'+(pct<0?' flat':'')+'">'+(pct>=0?'&#9650; +':'&#9660; ')+pct+'% vs '+esc(prevName)+'</div>';
  } else if(curT>0){
    h+='<div class="pdelta flat">First month on record</div>';
  }
  var improved=0,counted=0;
  ORDER.forEach(function(id){
    var cut=Date.now()-28*864e5,oldW=null;
    var ms=mainSessions();
    for(var i=ms.length-1;i>=0;i--){
      if(ms[i].ts>cut)continue;
      var en=ms[i].entries.find(function(e){return e.exId===id});
      if(en&&en.sets.length){oldW=en.sets[0].w;break}
    }
    if(oldW!==null){counted++;if(target(id).w>oldW)improved++}
  });
  h+='<div class="pstory">'+(sessN?'Moved in <b>'+sessN+' session'+(sessN>1?'s':'')+'</b> this month.':'No sessions logged this month yet.');
  if(counted===5&&improved===5)h+=' Every lift is heavier than it was four weeks ago.';
  else if(improved>0)h+=' <b>'+improved+' of '+counted+'</b> lifts are heavier than four weeks ago.';
  h+='</div></div>';
  return h;
}

        rows+='<div class="wr"><span>'+esc(EX[l.ex].name)+'</span><b>'+dispW(l.ex,l.from)+' \u2192 '+dispW(l.ex,l.to)+' kg</b></div>';
      });
      return '<div class="celeb" data-act="celebnext"><div class="ct">'+t+'</div><div class="cb">'+big+'</div><div class="cs">'+sub+'</div><div class="wul">'+rows+'</div><div class="ck">Tap to continue</div></div>';
    }
  }
  else if(c.type==='reppr'){t='New personal record';big=dispW(c.ex,c.w)+' kg Ã '+c.r;sub=esc(EX[c.ex].name)+' &middot; your strongest set at this weight';}
  else if(c.type==='milestone'){
    var subs={7:'One week of showing up.',14:'Two weeks straight.',30:'A full month.',50:'Fifty days. Serious.',100:'Triple digits. Rare air.'};
    t='Milestone';big=c.n+'-day streak';sub=subs[c.n]||'';
  }
  else if(c.type==='perfectweek'){t='Perfect week';big='7 / 7';sub='Every planned day, done.';}
  else if(c.type==='freeze'){t='Freeze used';big='\u2744';sub='A missed day, covered. Streak alive at '+c.cur+'.';}
  return '<div class="celeb" data-act="celebnext"><div class="ct">'+t+'</div><div class="cb">'+big+'</div><div class="cs">'+sub+'</div><div class="ck">Tap to continue</div></div>';
}

/* ---------------- render ---------------- */
var app=document.getElementById('app'),tabs=document.getElementById('tabs');
function render(){
  var html;
  if(S.draft){
    html=S.draft.away?rAwayLive():((S.draft.phase==='rest'&&S.timer)?rRestScreen():(S.draft.phase==='restover'?rRestoverScreen():rSetScreen()));if(!S.draft.away&&S.draft.phase==='rest'&&!S.timer){S.draft.phase='set';html=rSetScreen()}
  } else if(S.summary) {
    html=rWorkoutSummary();
  } else {
    html=(S.view==='mig52'?rMig52():S.view==='away'?rAwaySetup():S.view==='today'?rToday():S.view==='week'?rWeek():S.view==='history'?rHistory():rSettings());
  }
  app.innerHTML=html+celebHtml();
  document.body.classList.toggle('workout',!!S.draft||!!S.summary);
  app.classList.toggle('appcol',!S.draft&&!S.summary&&S.view==='today');
  var tabsDef=[['today','Today'],['week','Week'],['history','Progress'],['settings','Settings']];
  tabs.innerHTML=tabsDef.map(function(t){
    return '<button class="tab'+(S.view===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'<span class="dot"></span></button>';
  }).join('');
  var ln=document.getElementById('lightnote');
  if(ln){ln.addEventListener('input',function(){lightNote=ln.value})}
}

/* ---------------- actions ---------------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  audio();
  var a=b.dataset.act, ex=b.dataset.ex;

  if(a==='celebnext'){S.celebQueue.shift();save();render();return}
  if(a==='summarydone'){S.summary=null;save();render();return}
  if(a==='tab'){S.view=b.dataset.v;save();render();return}
  if(a==='start'){startDraft();save();render();return}if(a==='awayopen'){startAwayBuilder();return}if(a==='awaycancel'){S.view='today';save();render();return}if(a==='awaystart'){startAway();return}if(a==='awayfinish'){finishAway();return}if(a==='replopen'){var rk=b.dataset.day,rd=parseDayKey(rk);if(S.schedule[rd.getDay()].type==='lifts'){var cur=schedFor(rd);replPick={day:rk,ex:cur.ex.slice()};S.view='week';save();render()}return}
  if(a==='replslot'){if(replPick){var rs=+b.dataset.slot,rx=b.dataset.ex;if(rx===replPick.ex[1-rs])replPick.ex[1-rs]=replPick.ex[rs];replPick.ex[rs]=rx;render()}return}
  if(a==='replapply'){if(replPick){var bs=S.schedule[parseDayKey(replPick.day).getDay()].ex;if(bs[0]===replPick.ex[0]&&bs[1]===replPick.ex[1]){replPick=null;render();return}replaceWeekDay(replPick.day,replPick.ex);render()}return}
  if(a==='replcancel'){replPick=null;render();return}
  if(a==='replundo'){undoWeekDay(b.dataset.day);render();return}
  if(a==='makeup'){startMakeup();render();return}
  if(a==='release'){
    var yd2=new Date();yd2.setDate(yd2.getDate()-1);
    if(confirm('Let yesterday go? The missed day will count against the streak (a freeze covers it if you have one).')){
      S.releasedDays[dayKey(yd2.getTime())]=true;evalStreak();save();render();
    }
    return;
  }
  if(a==='canceldraft'){if(confirm('Discard this workout? Sets already marked done will be lost.')){S.draft=null;clearTimer();save();render()}return}
  if(a==='end'){
    var any=S.draft&&S.draft.queue.some(function(s){return s.done});
    if(any||confirm('Nothing logged yet. End without saving?'))finishWorkout();
    return;
  }
  if(a==='wp'||a==='wm'||a==='rp'||a==='rm'||a==='rq'){
    var s=S.draft.queue[ptr()];
    if(a==='wp'||a==='wm'){
      s.w=Math.max(0,Math.round((s.w+(a==='wp'?1:-1))*10)/10);
      S.overrides[s.ex]=s.w;
      S.draft.queue.forEach(function(q){if(!q.done&&q.ex===s.ex)q.w=s.w});
    }
    if(a==='rp'){s.r=Math.min(30,s.r+1);s.entered=true}
    if(a==='rm'){s.r=Math.max(1,s.r-1);s.entered=true}
    if(a==='rq'){s.r=+b.dataset.v;s.entered=true}
    save();render();return;
  }
  if(a==='done'){
    var idx=ptr();
    var s2=S.draft.queue[idx];
    s2.done=true;s2.entered=true;
    try{if('Notification' in window&&Notification.permission==='default'){Notification.requestPermission()}}catch(e2){}
    if(ptr()<0){finishWorkout();return}
    S.draft.phase='rest';
    startRest(s2.ex);
    save();render();return;
  }
  if(a==='addset'){
    var idx2=ptr();
    var cur=S.draft.queue[idx2];
    var lastSame=idx2;
    for(var i=S.draft.queue.length-1;i>=0;i--){if(S.draft.queue[i].ex===cur.ex){lastSame=i;break}}
    S.draft.queue.splice(lastSame+1,0,{ex:cur.ex,w:cur.w,r:cur.r,done:false,entered:false});
    save();render();return;
  }
  if(a==='tplus'){
    if(S.timer){S.timer.endsAt+=30000;S.timer.dur+=30;save();
      cancelPush();schedulePush(S.timer.endsAt);
      render()}
    return;
  }
  if(a==='skip'){if(S.draft)S.draft.phase='set';clearTimer();save();render();return}
  if(a==='skipset'){ /* v5.3: skip current set - not attempted, neutral for progression */
    var idx3=ptr();if(idx3<0)return;
    S.draft.queue[idx3].skipped=true;
    clearTimer();
    if(ptr()<0){finishWorkout();return}
    S.draft.phase='set';
    save();render();return;
  }
  if(a==='skipex'){ /* v5.3: skip the rest of this exercise */
    var idx4=ptr();if(idx4<0)return;
    var xex=S.draft.queue[idx4].ex;
    S.draft.queue.forEach(function(q){if(q.ex===xex&&!q.done)q.skipped=true});
    clearTimer();
    if(ptr()<0){finishWorkout();return}
    S.draft.phase='set';
    save();render();return;
  }
  if(a==='go'){if(S.draft)S.draft.phase='set';save();render();return}
  if(a==='chip'){histEx=ex;render();return}
  if(a==='del'){
    var si=+b.dataset.si;
    if(si>=0&&confirm('Delete this session?')){S.sessions.splice(si,1);save();render()}
    return;
  }
  if(a==='lrp'){lightRounds=Math.min(20,lightRounds+1);render();return}
  if(a==='lrm'){lightRounds=Math.max(1,lightRounds-1);render();return}
  if(a==='lmp'){lightMins=Math.min(10,lightMins+1);render();return}
  if(a==='lmm'){lightMins=Math.max(1,lightMins-1);render();return}
  if(a==='loglight'){
    S.sessions.push({ts:Date.now(),type:'light',rounds:lightRounds,minutes:lightMins,note:lightNote.trim()});
    lightNote='';fulfillToday();save();render();return;
  }
  if(a==='bwp'){S.settings.bw=Math.round((S.settings.bw+0.5)*10)/10;save();render();return}
  if(a==='mig52go'){doMig52();render();return}
  if(a==='bwm'){S.settings.bw=Math.max(30,Math.round((S.settings.bw-0.5)*10)/10);save();render();return}
  if(a==='restp'){S.settings.rest[ex]=Math.min(600,S.settings.rest[ex]+30);save();render();return}
  if(a==='restm'){S.settings.rest[ex]=Math.max(30,S.settings.rest[ex]-30);save();render();return}
  if(a==='incp'){S.settings.inc[ex]=Math.min(10,Math.round((incOf(ex)+0.5)*10)/10);save();render();return}
  if(a==='incm'){S.settings.inc[ex]=Math.max(0.5,Math.round((incOf(ex)-0.5)*10)/10);save();render();return}
  if(a==='st'){
    var d=+b.dataset.d;
    var cur2=S.schedule[d];
    if(cur2.type==='lifts')S.schedule[d]={type:'bag'};
    else if(cur2.type==='bag')S.schedule[d]={type:'rest'};
    else S.schedule[d]={type:'lifts',ex:['squat','pullup']};
    save();render();return;
  }
  if(a==='sl'){
    var d2=+b.dataset.d,slot=+b.dataset.slot;
    var curL=S.schedule[d2].ex[slot];
    var ni=(ORDER.indexOf(curL)+1)%ORDER.length;
    S.schedule[d2].ex[slot]=ORDER[ni];
    save();render();return;
  }
  if(a==='notif'){
    var st=document.getElementById('notifstatus');
    if(!pushOK()){if(st)st.textContent='Push needs the app installed on the home screen (and the worker deployed).';return}
    (async function(){
      try{
        var p=await Notification.requestPermission();
        if(st)st.textContent='Permission: '+p;
        if(p!=='granted')return;
        var reg=await navigator.serviceWorker.ready;
        var sub=await reg.pushManager.getSubscription();
        if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC)});
        if(st)st.textContent='Push is on. Rest alerts will arrive even locked.';
      }catch(err){if(st)st.textContent='Could not enable: '+err.message}
    })();
    return;
  }
  if(a==='import'){
    document.getElementById('importfile').click();return;
  }
  if(a==='export'){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    var u=URL.createObjectURL(blob);
    var l=document.createElement('a');l.href=u;l.download='forge-export.json';l.click();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);return;
  }
  if(a==='reset'){
    if(confirm('Wipe ALL training data on this device?')){localStorage.removeItem(LS);S={settings:{bw:75,rest:Object.assign({},REST_DEF)},schedule:JSON.parse(JSON.stringify(SCHED_DEF)),sessions:[],draft:null,timer:null,overrides:{},streak:{cur:0,best:0,freezes:0,lastEarned:0,lastCountedK:null,lastCountedTs:0,pwK:null},fulfilledDays:{},celebQueue:[],view:'today'};render()}
    return;
  }
});

document.body.insertAdjacentHTML('beforeend','<input type="file" id="importfile" accept="application/json" style="display:none">');
document.getElementById('importfile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var data=JSON.parse(r.result);
      if(!data||!Array.isArray(data.sessions)||!data.settings)throw new Error('not a FORGE export');
      localStorage.setItem(LS,JSON.stringify(data));
      location.reload();
    }catch(err){alert('Import failed: '+err.message)}
  };
  r.readAsText(f);
});

migrate51();
migrate52();
evalStreak();
if(schedFor(new Date()).type==='rest')fulfillToday();
render();
</script>
